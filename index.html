<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ink Note</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- ==========================================
         1. MÀN HÌNH DANH SÁCH GHI CHÚ
         ========================================== -->
    <div id="noteListView" class="note-list-view" style="display: none;">
      <header class="notes-header">
        <div class="notes-header-left">
          <h1 class="app-logo">Ink Note</h1>
          <span class="notes-subtext">Danh sách ghi chú</span>
        </div>
        <div class="notes-header-right">
          <button id="newNoteBtn" class="primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Ghi chú mới
          </button>

          <button id="newFolderBtn" class="secondary-btn" title="Tạo thư mục mới">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
            Thư mục mới
          </button>

          <button id="notesBackupBtn" class="tool-btn" title="Sao lưu / Khôi phục tất cả ghi chú">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>

          <!-- Nút mũi tên quay lại màn hình viết -->
          <button id="backToEditorBtn" class="tool-btn" title="Quay lại ghi chú đang mở">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>
        </div>
      </header>

      <!-- Thanh điều hướng Breadcrumb thư mục -->
      <div class="breadcrumb-container">
        <div class="breadcrumb-left">
          <button id="breadcrumbBackBtn" class="breadcrumb-back-btn" title="Lên thư mục cha (quay lại 1 cấp)" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <nav id="breadcrumbNav" class="breadcrumb-nav">
            <!-- Tự động sinh: Tất cả > Thư mục con... -->
          </nav>
        </div>
        <div id="folderStats" class="folder-stats"></div>
      </div>

      <!-- Lưới danh sách các thẻ thư mục và ghi chú -->
      <main class="notes-grid-container">
        <div id="notesGrid" class="notes-grid"></div>
      </main>
    </div>

    <!-- ==========================================
         2. MÀN HÌNH VIẾT VẼ (EDITOR VIEW)
         ========================================== -->
    <div id="editorView" class="editor-view">
      <!-- Cột danh sách trang bên trái (Sidebar) -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Trang (<span id="pageCount">1</span>)</span>
          <div class="sidebar-actions">
            <button id="addPageBtn" class="sidebar-action-btn" title="Thêm trang mới ngay sau trang này">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <button id="deletePageBtn" class="sidebar-action-btn" title="Xóa trang hiện tại">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        </div>
        <!-- Danh sách thumbnail các trang -->
        <div id="thumbnailList" class="thumbnail-list"></div>
      </aside>

      <!-- Không gian làm việc chứa Canvas và Thanh công cụ -->
      <main class="workspace">
        <!-- Thanh công cụ góc trên -->
        <div class="toolbar top-left">
          <!-- Nút Danh sách Ghi chú -->
          <button id="openNotesBtn" class="tool-btn" title="Xem danh sách tất cả ghi chú">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
          </button>

          <!-- Nút Bật / Tắt Sidebar -->
          <button id="sidebarToggleBtn" class="tool-btn active" title="Bật/Tắt danh sách trang">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
          </button>

          <div class="toolbar-divider"></div>

          <!-- Tên ghi chú đang mở -->
          <span id="currentNoteTitleBadge" class="note-title-badge" title="Tên ghi chú">Ghi chú 1</span>

          <div class="toolbar-divider"></div>

          <button id="undoBtn" class="tool-btn" title="Hoàn tác (Ctrl+Z)" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
          </button>
          <button id="redoBtn" class="tool-btn" title="Làm lại (Ctrl+Y)" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 7v6h-6"></path>
              <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
            </svg>
          </button>

          <div class="toolbar-divider"></div>

          <!-- Nút chọn Bút (P) -->
          <button id="penBtn" class="tool-btn active" title="Bút viết (P)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
            </svg>
          </button>

          <!-- Nút chọn Tẩy (E) -->
          <button id="eraserBtn" class="tool-btn" title="Tẩy nét (E)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
              <path d="M22 21H7"></path>
              <path d="m5 11 9 9"></path>
            </svg>
          </button>

          <!-- Nút chọn Lasso (L) -->
          <button id="lassoBtn" class="tool-btn" title="Chọn vùng Lasso (L)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 22a5 5 0 0 1-2-4"></path>
              <path d="M3.3 14A6.8 6.8 0 0 1 2 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 0 1-5-1"></path>
              <path d="M5 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path>
            </svg>
          </button>

          <div class="toolbar-divider"></div>

          <!-- Bảng 10 màu có sẵn -->
          <div class="color-palette" id="colorPalette">
            <button class="color-swatch active" data-color="#1a1a1a" style="--swatch-color: #1a1a1a;" title="Đen"></button>
            <button class="color-swatch" data-color="#757575" style="--swatch-color: #757575;" title="Xám"></button>
            <button class="color-swatch" data-color="#ffffff" style="--swatch-color: #ffffff;" title="Trắng"></button>
            <button class="color-swatch" data-color="#e53935" style="--swatch-color: #e53935;" title="Đỏ"></button>
            <button class="color-swatch" data-color="#fb8c00" style="--swatch-color: #fb8c00;" title="Cam"></button>
            <button class="color-swatch" data-color="#fdd835" style="--swatch-color: #fdd835;" title="Vàng"></button>
            <button class="color-swatch" data-color="#43a047" style="--swatch-color: #43a047;" title="Xanh lá"></button>
            <button class="color-swatch" data-color="#1e88e5" style="--swatch-color: #1e88e5;" title="Xanh dương"></button>
            <button class="color-swatch" data-color="#8e24aa" style="--swatch-color: #8e24aa;" title="Tím"></button>
            <button class="color-swatch" data-color="#6d4c41" style="--swatch-color: #6d4c41;" title="Nâu"></button>
          </div>

          <div class="toolbar-divider"></div>

          <!-- Thanh trượt độ dày nét & Vùng xem trước -->
          <div class="size-control">
            <input type="range" id="sizeSlider" min="2" max="25" value="5" step="1" title="Độ dày nét">
            <div class="size-preview-wrapper" title="Nét mẫu">
              <div id="sizePreviewDot"></div>
            </div>
          </div>

          <div class="toolbar-divider"></div>

          <!-- Nút mở menu Cài đặt Giấy -->
          <button id="paperBtn" class="tool-btn" title="Cài đặt loại giấy & màu nền">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <line x1="10" y1="9" x2="8" y2="9"></line>
            </svg>
          </button>

          <!-- Nút mở menu Sao lưu & Phục hồi -->
          <button id="backupBtn" class="tool-btn" title="Sao lưu & Khôi phục file">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>
        </div>

        <!-- Menu Popover Cài đặt Giấy -->
        <div id="paperMenu" class="paper-popover">
          <div class="popover-section">
            <div class="popover-title">Loại giấy</div>
            <div class="pill-group" id="patternGroup">
              <button class="pill-btn active" data-pattern="none">Trắng trơn</button>
              <button class="pill-btn" data-pattern="ruled">Kẻ ngang</button>
              <button class="pill-btn" data-pattern="grid">Ô vuông</button>
            </div>
          </div>

          <div class="popover-section" id="spacingSection" style="display: none;">
            <div class="popover-title">Khoảng cách dòng / ô</div>
            <div class="pill-group" id="spacingGroup">
              <button class="pill-btn" data-spacing="narrow">Hẹp</button>
              <button class="pill-btn active" data-spacing="medium">Vừa</button>
              <button class="pill-btn" data-spacing="wide">Rộng</button>
            </div>
          </div>

          <div class="popover-section">
            <div class="popover-title">Hướng giấy</div>
            <div class="pill-group" id="orientationGroup">
              <button class="pill-btn active" data-orientation="portrait">Dọc</button>
              <button class="pill-btn" data-orientation="landscape">Ngang</button>
            </div>
          </div>

          <div class="popover-section">
            <div class="popover-title">Màu nền trang</div>
            <div class="bg-color-group" id="bgColorGroup">
              <button class="bg-color-btn active" data-bg="white" style="--bg-c: #ffffff;" title="Trắng"></button>
              <button class="bg-color-btn" data-bg="cream" style="--bg-c: #faf5eb;" title="Kem"></button>
              <button class="bg-color-btn" data-bg="gray" style="--bg-c: #e8eaed;" title="Xám nhạt"></button>
              <button class="bg-color-btn" data-bg="dark" style="--bg-c: #1e1f22;" title="Tối"></button>
            </div>
          </div>
        </div>

        <!-- Menu Popover Sao lưu & Khôi phục -->
        <div id="backupMenu" class="backup-popover">
          <div class="popover-section">
            <div class="popover-title">Sao lưu dữ liệu (.json)</div>
            <div class="backup-actions">
              <button id="exportBackupBtn" class="backup-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Xuất file sao lưu
              </button>
              <button id="importBackupBtn" class="backup-btn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Nhập file sao lưu
              </button>
              <input type="file" id="importFileInput" accept=".json" style="display: none;">
            </div>
          </div>
        </div>

        <!-- Ô chữ nhỏ hiển thị trạng thái lưu ở góc màn hình -->
        <div id="saveStatus" class="save-status">Đã lưu</div>

        <!-- Vòng tròn chỉ thị vị trí đầu tẩy -->
        <div id="eraserCursor"></div>

        <!-- Thanh thao tác nổi cho vùng chọn Lasso -->
        <div id="selectionActions" class="selection-actions" style="display: none;">
          <button id="deleteSelectionBtn" class="selection-action-btn delete-btn" title="Xóa nét đã chọn (Delete)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Xóa
          </button>
          <button id="copySelectionBtn" class="selection-action-btn" title="Sao chép nét đã chọn (Ctrl+C)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Sao chép
          </button>
          <button id="deselectBtn" class="selection-action-btn" title="Bỏ chọn">
            ✕
          </button>
        </div>

        <!-- Canvas bao trọn màn hình -->
        <canvas id="inkCanvas"></canvas>
        <!-- Nút hiển thị và đặt lại zoom về 100% -->
        <button id="resetZoomBtn" title="Nhấn để về 100%">100%</button>
      </main>
    </div>
  </div>

  <!-- Modal Tạo Thư mục Mới -->
  <div id="newFolderModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Tạo thư mục mới</h3>
        <button id="closeNewFolderModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <form id="newFolderForm" class="modal-form">
        <div class="modal-body">
          <label for="newFolderNameInput" class="modal-label">Nhập tên thư mục:</label>
          <input type="text" id="newFolderNameInput" class="modal-input" placeholder="Ví dụ: Toán 12" value="Thư mục mới" maxlength="50" autocomplete="off" required>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelNewFolderBtn" class="secondary-btn">Hủy bỏ</button>
          <button type="submit" id="confirmNewFolderBtn" class="primary-btn">Tạo thư mục</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Chuyển Ghi chú vào Thư mục -->
  <div id="moveNoteModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Chuyển ghi chú</h3>
        <button id="closeMoveModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Chọn thư mục đích cho ghi chú <b id="moveModalNoteTitle"></b>:</p>
        <div id="moveFolderList" class="move-folder-list"></div>
      </div>
      <div class="modal-footer">
        <button id="cancelMoveBtn" class="secondary-btn">Hủy bỏ</button>
      </div>
    </div>
  </div>

  <!-- Modal Xác nhận Xóa Thư mục -->
  <div id="deleteFolderModal" class="modal-overlay" style="display: none;">
    <div class="modal-card danger-card">
      <div class="modal-header">
        <h3 class="modal-title">Xóa thư mục</h3>
        <button id="closeDeleteFolderModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <p id="deleteFolderMessage" class="modal-desc"></p>
      </div>
      <div class="modal-footer flex-col">
        <button id="deleteFolderOrphanBtn" class="modal-action-btn primary-outline-btn">
          Chỉ xóa thư mục (đưa các ghi chú ra ngoài)
        </button>
        <button id="deleteFolderCascadeBtn" class="modal-action-btn danger-btn">
          Xóa vĩnh viễn cả thư mục và tất cả ghi chú
        </button>
        <button id="cancelDeleteFolderBtn" class="modal-action-btn cancel-btn">Hủy bỏ</button>
      </div>
    </div>
  </div>

  <script src="perfect-freehand.js"></script>
  <script src="storage.js"></script>
  <script src="script.js"></script>
</body>
</html>
